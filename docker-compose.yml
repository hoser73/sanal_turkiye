# Tek sunucu kurulumu: uygulama + Caddy (otomatik HTTPS, WebSocket vekili). Kullanım: docs/yayina-alma.md
# Veri birimi (veri → /veri): veritabanı, gunluk/, yedekler/, karolar/ ve yukselti/ önbellekleri, ftw/ tarla kaynağı.
services:
  uygulama:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - veri:/veri
    expose:
      - "3400"
    # SIGTERM'de bağlantılar kapanır ve veritabanı en çok 8 sn'de kapatılır
    stop_grace_period: 15s
  caddy:
    image: caddy:2.8
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      ALAN_ADI: ${ALAN_ADI:?ALAN_ADI tanımlı olmalı}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_veri:/data
      - caddy_ayar:/config
    depends_on:
      uygulama:
        condition: service_healthy
volumes:
  veri:
  caddy_veri:
  caddy_ayar:
